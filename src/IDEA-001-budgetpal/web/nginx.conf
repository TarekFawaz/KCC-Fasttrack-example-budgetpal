# Replaces /etc/nginx/conf.d/default.conf in nginx-unprivileged (listens on 8080).
# Same-origin proxy: the browser only talks to this server, so the api sends no
# CORS headers (GR-005). Headers are set once at server level with `always`;
# locations below add none of their own, so nothing is overridden.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # /api/health -> http://api:3000/health (prefix stripped by the trailing slash).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The api also sets these; keep one copy, the one nginx adds above.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
